name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "discord.py[voice]" yt-dlp youtube-search-python termcolor aiosqlite aiohttp aiohttp_retry
          pip install pytest pytest-asyncio ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        # PUBG_TOKEN이 없으므로 network 마커 테스트는 자동으로 건너뛴다.
        run: pytest
