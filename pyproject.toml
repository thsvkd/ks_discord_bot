[project]
name = "ks-bot"
version = "0.2.0"
description = "PUBG 전적 조회와 음악 재생을 지원하는 디스코드 봇"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "thsvkd", email = "thsxogud1123@gmail.com" }]
dependencies = [
    "discord.py[voice]>=2.3",
    "yt-dlp",
    "youtube-search-python",
    "termcolor",
    "aiosqlite",
    "aiohttp",
    "aiohttp-retry",
    # 윈도우에는 시스템 tz 데이터베이스가 없어 zoneinfo가 tzdata 패키지를 필요로 한다.
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
ks-bot = "ks_bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ks_bot"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra -v --strict-markers"
asyncio_mode = "auto"
markers = [
    "network: 외부 네트워크(PUBG/YouTube API)가 필요한 테스트 (`-m 'not network'`로 제외)",
]
filterwarnings = [
    # discord.py 내부에서 발생하는 표준 라이브러리 deprecation 경고는 우리가 고칠 수 없다.
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 150
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff 고유 규칙
]
ignore = [
    "B008",   # 기본 인자에서의 함수 호출(디스코드 데코레이터 패턴과 충돌)
    "RUF001", # 한글 주석의 전각 문자 경고
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["ks_bot", "factories"]
